<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brick Racers">
  <meta name="theme-color" content="#8fd3ff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Brick Racers</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "cannon-es": "./vendor/cannon-es/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <section id="home" class="screen">
    <header class="home-top">
      <button class="player-chip" data-action="figures" aria-label="My figures">
        <img id="home-figure" alt="">
        <span><small>Driver</small><b id="home-name">You</b></span>
        <i>✏️</i>
      </button>
      <div class="spacer"></div>
      <button class="install-btn hidden" data-action="install">⬇ Install</button>
      <div class="coin-count" id="home-coins">🪙 <b>0</b></div>
    </header>
    <div class="home-main">
      <h1 class="logo"><span class="logo-brick c-red">Brick</span><span class="logo-brick c-yellow">Racers</span></h1>
      <nav class="home-menu">
        <button class="big-btn race" data-action="race"><span class="bi">🏁</span><span class="bt"><b>Race</b><small>3 laps, 3 rivals</small></span></button>
        <button class="big-btn city" data-action="city"><span class="bi">🏙</span><span class="bt"><b>City</b><small>Drive around town</small></span></button>
        <button class="big-btn c-green" data-action="cars"><span class="bi">🚗</span><span class="bt"><b>My cars</b><small>Build, change or delete</small></span></button>
        <button class="big-btn c-purple" data-action="together"><span class="bi">🤝</span><span class="bt"><b>Play together</b><small id="home-together">With friends, online</small></span></button>
      </nav>
    </div>
  </section>

  <section id="figures" class="screen hidden">
    <header class="bar">
      <button class="icon-btn" data-action="home" aria-label="Home">🏠</button>
      <h2>My Figures</h2>
    </header>
    <div id="figures-list" class="garage-list"></div>
  </section>

  <section id="figure" class="screen hidden passthrough">
    <header class="bar">
      <button class="icon-btn" data-fig="home" aria-label="Home">🏠</button>
      <h2 class="fig-title">Make your figure!</h2>
    </header>
    <div class="fig-panel card">
      <div class="fig-tabs">
        <button data-tab="head">Head</button>
        <button data-tab="face">Face</button>
        <button data-tab="skin">Skin</button>
        <button data-tab="shirt">Shirt</button>
        <button data-tab="pants">Pants</button>
      </div>
      <div id="fig-tiles" class="fig-tiles"></div>
      <div id="fig-colors" class="fig-colors"></div>
    </div>
    <footer class="fig-actions">
      <button class="tool-btn c-purple" data-fig="random">🎲<small>Surprise me</small></button>
      <button class="go-btn" data-fig="done">✓ Done</button>
    </footer>
  </section>

  <section id="together" class="screen hidden">
    <header class="bar">
      <button class="icon-btn" data-action="home" aria-label="Home">🏠</button>
      <h2>Play together</h2>
    </header>
    <div id="together-body" class="together-body"></div>
  </section>

  <section id="garage" class="screen hidden">
    <header class="bar">
      <button class="icon-btn" data-action="home" aria-label="Home">🏠</button>
      <h2>My Cars</h2>
      <button class="tool-btn c-blue hidden" data-action="city">🏙<small>Back to city</small></button>
    </header>
    <div id="garage-list" class="garage-list"></div>
  </section>

  <section id="build" class="screen hidden passthrough">
    <header class="bar">
      <button class="icon-btn" data-tool="home" aria-label="Home">🏠</button>
      <div class="tools">
        <button class="tool-btn" data-tool="undo">↶<small>Undo</small></button>
        <button class="tool-btn" data-tool="rotate">⟳<small>Turn</small></button>
        <button class="tool-btn" data-tool="delete">🗑<small>Remove</small></button>
        <button class="tool-btn" data-tool="clear">✖<small>Clear</small></button>
      </div>
      <button class="go-btn" data-tool="done">🏁 Race!</button>
    </header>
    <aside id="instruction-card" class="card hidden">
      <div class="step-count"></div>
      <div class="step-bar"><i></i></div>
      <img class="step-img" alt="">
      <p class="step-text"></p>
      <button class="icon-btn speak" data-tool="speak" aria-label="Read it to me">🔊</button>
    </aside>
    <aside id="checklist" class="card hidden"></aside>
    <footer class="tray-wrap plate">
      <button id="place-btn" class="place-btn hidden" data-tool="place">✓ Place</button>
      <div id="tray-tabs" class="tray-tabs"></div>
      <div id="colors" class="colors"></div>
      <div id="tray" class="tray"></div>
    </footer>
  </section>

  <section id="race" class="screen hidden passthrough">
    <div class="hud-top">
      <div class="hud-pos" id="hud-pos"><span id="hud-position">1st</span><small id="hud-lap">Lap 1/2</small><span class="lap-dots" id="lap-dots" data-lap="1" aria-hidden="true"><i></i><i></i></span></div>
      <canvas id="minimap" width="360" height="360"></canvas>
    </div>
    <button class="icon-btn pause-btn" data-race="pause" aria-label="Pause">⏸</button>
    <button class="flip-btn" data-race="flip">🙃 Flip me!</button>
    <div class="gadgets">
      <button class="gadget-btn hidden" data-gadget="boost">🚀<small>Boost</small></button>
      <button class="gadget-btn hidden" data-gadget="horn">📯<small>Honk</small></button>
      <button class="gadget-btn hidden" data-gadget="siren">🚨<small>Siren</small></button>
      <button class="gadget-btn hidden" data-gadget="confetti">🎉<small>Confetti</small></button>
    </div>
    <div id="countdown" class="countdown hidden"></div>
    <div class="speedo"></div>
    <div class="pad left">
      <button class="pad-btn" data-control="left" aria-label="Steer left">◀</button>
      <button class="pad-btn" data-control="right" aria-label="Steer right">▶</button>
    </div>
    <div class="pad right">
      <button class="pad-btn stop" data-control="stop">STOP</button>
      <button class="pad-btn go" data-control="go">GO</button>
    </div>
  </section>
  <section id="city" class="screen hidden passthrough on-foot">
    <div class="city-top">
      <button class="icon-btn" data-city="home" aria-label="Home">🏠</button>
      <button class="icon-btn" data-city="pause" aria-label="Pause">⏸</button>
      <button class="tool-btn c-blue" data-city="cars">🚗<small>My cars</small></button>
      <div class="coin-count" id="coin-count">🪙 <b>0</b></div>
      <div id="city-friends" class="friend-chips room-only"></div>
    </div>
    <canvas id="city-map" width="340" height="340" aria-label="Map"></canvas>
    <div class="room-tools room-only">
      <button class="tool-btn c-purple" data-city="games">🎮<small>Games</small></button>
      <button class="tool-btn c-yellow" data-city="stickers">😀<small>Stickers</small></button>
    </div>
    <div id="sticker-tray" class="sticker-tray hidden"></div>
    <div id="game-hud" class="game-hud hidden"><span class="gh-emoji"></span><span class="gh-text"></span><span class="gh-timer"></span><ol class="gh-scores"></ol></div>
    <div id="game-arrow" class="game-arrow hidden">⬆</div>
    <div id="game-big" class="countdown hidden"></div>
    <div id="stunt-pop" class="stunt-pop hidden"></div>
    <div id="showroom-panel" class="mission-banner showroom-panel hidden"><span class="m-emoji">🎁</span><span class="s-text"></span><button class="brk c-green s-go">🧮 Let's go!</button></div>
    <div id="showroom-flash" class="showroom-flash"></div>
    <div id="mission-banner" class="mission-banner hidden"><span class="m-emoji"></span><span class="m-text"></span><span class="m-timer"></span><button class="icon-btn" data-city="quit-mission" aria-label="Stop mission">✖</button></div>
    <div id="stick" class="stick foot-only"><div class="knob"></div></div>
    <button class="big-action foot-only hidden" data-city="enter">🚗 Get in</button>
    <button class="big-action exit drive-only" data-city="exit">🚶 Get out</button>
    <button class="big-action hitch drive-only hidden" data-city="hitch">🔗 Hook on</button>
    <button class="flip-btn drive-only" data-city="flip">🙃 Flip me!</button>
    <div class="gadgets drive-only">
      <button class="gadget-btn hidden" data-gadget="boost">🚀<small>Boost</small></button>
      <button class="gadget-btn hidden" data-gadget="horn">📯<small>Honk</small></button>
      <button class="gadget-btn hidden" data-gadget="siren">🚨<small>Siren</small></button>
      <button class="gadget-btn hidden" data-gadget="confetti">🎉<small>Confetti</small></button>
    </div>
    <div class="speedo drive-only"></div>
    <div class="pad left drive-only">
      <button class="pad-btn" data-control="left" aria-label="Steer left">◀</button>
      <button class="pad-btn" data-control="right" aria-label="Steer right">▶</button>
    </div>
    <div class="pad right drive-only">
      <button class="pad-btn stop" data-control="stop">STOP</button>
      <button class="pad-btn go" data-control="go">GO</button>
    </div>
  </section>

  <div id="room-banner" class="room-banner hidden"><span class="rb-text"></span><button class="go-btn" data-banner="join">Join them</button><button class="icon-btn" data-banner="close" aria-label="Not now">✖</button></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="rotate-hint">
    <p>Turn your iPad sideways to race! ↻</p>
    <button class="big-btn race" data-action="home"><span class="bi">🏠</span><span class="bt"><b>Home</b></span></button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
